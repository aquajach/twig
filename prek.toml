[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "end-of-file-fixer" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome"
name = "biome"
language = "system"
pass_filenames = false
entry = "pnpm lint:fix"
priority = 1

[[repos.hooks]]
id = "type-check"
name = "type-check"
language = "system"
pass_filenames = false
entry = "pnpm type-check"
priority = 1
